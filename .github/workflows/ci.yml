name: CI

on:
  push:
    branches: [develop, main, "feature/**"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 app tests

      - name: Layering check
        run: |
          if grep -rEn "import sqlite3|from flask|import flask" app/domain app/services app/validators; then
            echo "Layering violation: domain, services and validators must not import Flask or sqlite3"
            exit 1
          fi
          echo "Layering OK"

      - name: Unit tests
        run: pytest -m "not integration"

      - name: Integration tests and coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Complexity report
        run: radon cc app -a -nB

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t hms-app .
